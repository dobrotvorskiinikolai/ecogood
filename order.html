<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EcoGoods — Оформление заказа</title>
    <link rel="icon" href="images\logotitle.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/font.css">
</head>

<body>
    <div id="nav-placeholder"></div>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span>EcoGoods</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">О нас</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="order.html">Заказать</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4 my-font">
        <h1>Оформление заказа</h1>

        <form id="orderForm" class="row g-3" novalidate>
            <div class="col-12">
                <label class="form-label">Наименование товара</label>
                <input name="product_name" id="product_name" type="text" class="form-control"
                    placeholder="Название товара" required>
            </div>

            <div class="col-6 col-md-3">
                <label class="form-label">Количество</label>
                <input name="quantity" id="quantity" type="number" class="form-control" min="1" value="1" required>
            </div>

            <div class="col-12">
                <label class="form-label d-block">Доставка</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="delivery" id="delivery_pickup" value="pickup"
                        checked>
                    <label class="form-check-label" for="delivery_pickup">Самовывоз</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="delivery" id="delivery_courier" value="courier">
                    <label class="form-check-label" for="delivery_courier">Курьер</label>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label">Комментарий</label>
                <textarea name="comment" id="comment" class="form-control" rows="3"
                    placeholder="Комментарий к заказу"></textarea>
            </div>

            <div class="col-12">
                <button id="submitBtn" class="btn btn-success">Отправить заказ</button>
            </div>
        </form>

        <div id="result" class="mt-4"></div>
    </main>

    <script src="js/nav.js"></script>
    <script src="js/form.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
