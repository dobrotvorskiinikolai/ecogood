<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EcoGoods — Каталог (тест)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        h1 { color: #2c7a7b; margin-bottom: 30px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 20px 0; }
        .product { border: 1px solid #ddd; border-radius: 5px; padding: 15px; text-align: center; }
        .product img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .product h3 { color: #2c7a7b; margin: 10px 0; }
        .product p { margin: 5px 0; }
        .btn { display: inline-block; padding: 8px 16px; background: #28a745; color: white; text-decoration: none; border-radius: 3px; margin: 5px; }
        .btn-outline { background: white; color: #007bff; border: 1px solid #007bff; }
        nav { background: #f8f9fa; padding: 10px; margin-bottom: 20px; }
        a { color: #2c7a7b; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <nav>
        <a href="index-minimal.html">Главная (тест)</a> |
        <a href="about-minimal.html">О нас (тест)</a> |
        <a href="shop-minimal.html">Каталог (тест)</a> |
        <a href="index.html">Полная версия</a>
    </nav>

    <div class="container">
        <h1>Каталог товаров</h1>

        <div class="products">
            <div class="product">
                <img src="images/22b3e81599c611eab41e48a472b98150_33cd143ba0d011eb805a001a7dda7113.png" alt="Бамбуковая щетка">
                <h3>Бамбуковая щетка</h3>
                <p>Цена: 120 ₽</p>
                <a href="#" class="btn">Заказать</a>
                <button class="btn btn-outline">В корзину</button>
            </div>

            <div class="product">
                <img src="images/bottle.jpg" alt="Многоразовая бутылка">
                <h3>Многоразовая бутылка</h3>
                <p>Цена: 850 ₽</p>
                <a href="#" class="btn">Заказать</a>
                <button class="btn btn-outline">В корзину</button>
            </div>

            <div class="product">
                <img src="images/orig.webp" alt="Набор пакетов">
                <h3>Набор многоразовых пакетов</h3>
                <p>Цена: 420 ₽</p>
                <a href="#" class="btn">Заказать</a>
                <button class="btn btn-outline">В корзину</button>
            </div>

            <div class="product">
                <img src="images/luffa-dish-washing-7.jpg" alt="Экологичная губка">
                <h3>Экологичная губка</h3>
                <p>Цена: 75 ₽</p>
                <a href="#" class="btn">Заказать</a>
                <button class="btn btn-outline">В корзину</button>
            </div>
        </div>

        <p style="text-align: center; margin-top: 30px;">
            <a href="index-minimal.html">← На главную</a>
        </p>
    </div>
</body>
</html>
